<!--
  A hand-written miniature of a DuckDuckGo HTML results page: three result anchors,
  hrefs wrapped in the /l/?uddg= redirector, plus one ad link and one internal
  DuckDuckGo link that the parser must ignore. Written by hand rather than saved
  from the live site so it stays small, stable and free of tracking parameters.
-->
<!DOCTYPE html>
<html><head><title>owner's manual pdf at DuckDuckGo</title></head>
<body>
<div class="results">

  <div class="result results_links">
    <div class="links_main">
      <a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fcdn.westinghouseoutdoorpower.com%2Fowners_manuals%2FePX3030_manual_web.pdf&amp;rut=abc123">ePX3030 Owner&#x27;s Manual - Westinghouse Outdoor Power</a>
      <div class="result__snippet">Pressure washer owner's manual, assembly on pages 10-12.</div>
    </div>
  </div>

  <div class="result results_links">
    <div class="links_main">
      <a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fwww.manualslib.com%2Fmanual%2F123456%2FWestinghouse-Epx3030.html&amp;rut=def456">Westinghouse ePX3030 Manuals | ManualsLib</a>
      <div class="result__snippet">View online or download the manual.</div>
    </div>
  </div>

  <div class="result results_links">
    <div class="links_main">
      <a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DdQw4w9WgXcQ&amp;rut=ghi789">Westinghouse ePX3030 assembly <b>video</b></a>
      <div class="result__snippet">Unboxing and assembly walkthrough.</div>
    </div>
  </div>

  <div class="result result--ad">
    <div class="links_main">
      <a class="result__a--ad" href="https://example-ad.test/sponsored">Buy a pressure washer today</a>
    </div>
  </div>

  <a class="header__logo" href="https://duckduckgo.com/">DuckDuckGo</a>

</div>
</body></html>
